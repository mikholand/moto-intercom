# XcodeGen-спецификация: на Mac выполните `xcodegen generate` в этой папке,
# затем откройте AudioSpike.xcodeproj и выберите свою команду в Signing & Capabilities.
name: AudioSpike
options:
  bundleIdPrefix: com.example.motointercom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AudioSpike:
    type: application
    platform: iOS
    sources:
      - path: AudioSpike
    # Общая схема нужна для `xcodebuild -scheme` в CI.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.motointercom.audiospike
        INFOPLIST_FILE: AudioSpike/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
